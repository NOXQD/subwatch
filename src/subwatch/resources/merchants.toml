# Built-in dictionary of known services.
#
# [<id>]
# name       - canonical name shown to the user
# category   - category key (music, video, cloud, games, education, software, other)
# senders    - sender domains or addresses; a domain also matches its subdomains
# patterns   - case-insensitive regexes for statement descriptors, subjects and bodies
# shared     - true when the sender domain hosts many services (google.com,
#              apple.com...): then a pattern hit is required to pick this entry
# generic    - umbrella entry used only when nothing more specific matched
# period     - default billing period when the message does not say
# cancel_url - where to cancel
# includes   - ids of services that come bundled (for duplicate detection)
#
# Users extend or override entries in ~/.config/subwatch/merchants.toml with
# the same format.

# ----------------------------------------------------------------- video

[netflix]
name = "Netflix"
category = "video"
senders = ["netflix.com", "mailer.netflix.com"]
patterns = ['netflix']
cancel_url = "https://www.netflix.com/cancelplan"
period = "1m"

[youtube_premium]
name = "YouTube Premium"
category = "video"
senders = ["youtube.com"]
patterns = ['youtube\s*premium', 'youtubepremium', 'google\s*\*\s*youtube']
shared = true
cancel_url = "https://www.youtube.com/paid_memberships"
period = "1m"
includes = ["youtube_music"]

