negative = "значение не может быть отрицательным"
category_key = "ключ категории «{value}»: только латиница в нижнем регистре, цифры, - и _"
unknown_category = "правило ссылается на несуществующую категорию «{value}»"
period = "«{value}» — не период; примеры: 1m, 3m, 1y, 1w, 14d, monthly"
set_syntax = "ожидается ключ=значение"
toml = "не удалось разобрать TOML: {detail}"
toml_at = "синтаксическая ошибка TOML в строке {line}, позиция {column}"
