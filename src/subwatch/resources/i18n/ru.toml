# ------------------------------------------------------------- gmail wizard

[auth.gmail]
title = "Подключение Gmail"
intro = """Subwatch читает почту через ваш собственный проект Google Cloud с доступом только на чтение (gmail.readonly). Писать и удалять письма он не может. Токен попадёт в системный keyring, в файлы он не пишется.

Настройка делается один раз и занимает минут десять."""
step_header = "Шаг {n} из {total}. {title}"
ask_path = "Путь к скачанному JSON-файлу клиента:"
opening_browser = "Открываю браузер для входа в Google…"
copy_url = "Откройте ссылку ниже в браузере на этом компьютере:"
prompt_url = "Откройте в браузере: {url}"
browser_success = "Subwatch получил доступ. Окно можно закрыть."
extra_scopes = "Google выдал лишние разрешения ({scopes}) — Subwatch ими не пользуется."
connected = "Gmail подключён: {email}"
saved = "Источник включён в {path}"
delete_json = "Удалить файл {path}? Секрет клиента уже сохранён в keyring."
json_deleted = "Файл удалён."
reminder_production = "Если проект остался в режиме Testing, Google отзовёт доступ через 7 дней. Переведите его в «In production» (шаг 5) и выполните subwatch auth gmail ещё раз."

[auth.gmail.step1]
title = "Проект"
body = "Откройте https://console.cloud.google.com/projectcreate и создайте проект, например «subwatch». Платёжные данные не нужны."

[auth.gmail.step2]
title = "Gmail API"
body = "Включите Gmail API для этого проекта: https://console.cloud.google.com/apis/library/gmail.googleapis.com → «Enable»."

[auth.gmail.step3]
title = "Экран согласия"
body = """Откройте Google Auth Platform → Branding: https://console.cloud.google.com/auth/branding
  • App name — любое, например «Subwatch»;
  • User support email и Developer contact — ваш адрес.
В разделе Audience выберите тип «External» и добавьте свой адрес Gmail в Test users."""

[auth.gmail.step4]
title = "Разрешение"
body = "В разделе Data Access нажмите «Add or remove scopes» и добавьте только https://www.googleapis.com/auth/gmail.readonly. Больше ничего не нужно."

[auth.gmail.step5]
title = "Режим «In production» — важно"
body = """Пока проект в режиме Testing, Google выдаёт токен всего на 7 дней, потом придётся входить заново. Для личного использования переведите проект в боевой режим: Audience → «Publish app» → подтвердите.

Проверка приложения Google при этом не нужна: проект ваш, пользователь — вы. При входе Google покажет экран «Google hasn't verified this app» — это нормально для своего проекта. Нажмите «Advanced» → «Go to Subwatch (unsafe)»."""

[auth.gmail.step6]
title = "OAuth-клиент"
body = "Clients → «Create client» → тип «Desktop app» → имя любое → Create. Скачайте JSON (кнопка «Download JSON»)."

[auth.gmail.step7]
title = "Вход"
body = "Укажите путь к скачанному JSON ниже. Откроется браузер: войдите в нужный аккаунт Gmail и разрешите доступ на чтение."

