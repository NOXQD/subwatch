# Русский каталог строк Subwatch. Это эталонный каталог: каждый ключ, который
# есть в коде, должен быть здесь. Остальные языки могут переводить не всё —
# недостающие строки берутся отсюда.

[meta]
name = "Русский"
plural = "slavic"

[fmt]
group_separator = "\u00a0"
decimal_separator = ","
money = "{amount}\u00a0{symbol}"
unknown_amount = "сумма неизвестна"
no_date = "—"
no_period = "—"
date = "{day} {month}"
date_year = "{day} {month} {year}"
date_short = "{day} {month}"
date_weekday = "{weekday}, {date}"
datetime = "{date}, {time}"
when = "{date}, {relative}"
percent = "{value}\u00a0%"

[fmt.months]
genitive = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"]
nominative = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"]
short = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"]

[fmt.weekdays]
full = ["понедельник", "вторник", "среда", "четверг", "пятница", "суббота", "воскресенье"]
short = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"]

[fmt.rel]
today = "сегодня"
tomorrow = "завтра"
yesterday = "вчера"
in_days = { one = "через {n} день", few = "через {n} дня", many = "через {n} дней" }
days_ago = { one = "{n} день назад", few = "{n} дня назад", many = "{n} дней назад" }

[fmt.units]
day = { one = "{n} день", few = "{n} дня", many = "{n} дней" }
hour = { one = "{n} час", few = "{n} часа", many = "{n} часов" }
minute = { one = "{n} минута", few = "{n} минуты", many = "{n} минут" }
subscription = { one = "{n} подписка", few = "{n} подписки", many = "{n} подписок" }
item = { one = "{n} запись", few = "{n} записи", many = "{n} записей" }

[fmt.period]
every_1_day = "ежедневно"
every_1_week = "еженедельно"
every_1_month = "ежемесячно"
every_1_year = "ежегодно"
quarterly = "раз в квартал"
every_n_day = { one = "раз в {n} день", few = "раз в {n} дня", many = "раз в {n} дней" }
every_n_week = { one = "раз в {n} неделю", few = "раз в {n} недели", many = "раз в {n} недель" }
every_n_month = { one = "раз в {n} месяц", few = "раз в {n} месяца", many = "раз в {n} месяцев" }
every_n_year = { one = "раз в {n} год", few = "раз в {n} года", many = "раз в {n} лет" }
short_day = "день"
short_week = "нед"
short_month = "мес"
short_year = "год"
short_n = "{n} {unit}"

[category]
music = "Музыка"
video = "Видео"
cloud = "Облако"
games = "Игры"
education = "Обучение"
software = "Софт"
other = "Прочее"

[config.err]
header = "Ошибка в конфигурации {path}:"
header_value = "Неверное значение:"
line = "  • {key}: {message}"
missing = "обязательный параметр не задан"
unknown_key = "неизвестный параметр (опечатка?)"
int = "ожидается целое число"
float = "ожидается число"
number = "ожидается число"
bool = "ожидается true или false"
string = "ожидается строка в кавычках"
list = "ожидается список, например [1, 2] или \"a, b\""
table = "ожидается таблица (раздел)"
ge = "должно быть не меньше {ge}"
le = "должно быть не больше {le}"
gt = "должно быть больше {gt}"
lt = "должно быть меньше {lt}"
literal = "допустимые значения: {expected}"
or = " или "
generic = "неверное значение ({detail})"
duration = "«{value}» — не длительность; примеры: 15m, 4h, 1d, 2w"
clock = "«{value}» — не время суток; нужен формат ЧЧ:ММ, например 09:30"
