# ----------------------------------------------------------------- privacy

[privacy]
title = "Что хранит Subwatch"
principles = "Хранятся только извлечённые факты: сервис, сумма, даты, источник. Тексты писем не сохраняются, идентификаторы писем хранятся как хэши. Почта читается только на чтение."
