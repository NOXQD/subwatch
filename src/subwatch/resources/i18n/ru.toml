[cli.app]
help = """Subwatch — локальный трекер подписок для Omarchy.

Находит подписки в почте (Gmail, IMAP) и банковских выписках, напоминает о списаниях и считает, сколько уходит в месяц. Всё хранится у вас на компьютере.

Без команды открывает TUI."""
