table_line = "  {name}: {count}"
snippets_on = "Фрагменты писем сохраняются (extraction.store_snippets = true), сейчас их {count}."
snippets_off = "Фрагменты писем не сохраняются."
secrets = "Записи в keyring (только имена):"
secret_line = "  {name}"
no_secrets = "  нет"
ai = "AI-модели:"
ai_none = "  Ничего не отправлялось."
ai_total = "  Запросов всего: {total}, из них в облако: {cloud}."
