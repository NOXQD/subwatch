[auth.gmail]
title = "Connecting Gmail"
intro = """Subwatch reads mail through your own Google Cloud project with read-only access (gmail.readonly). It cannot send or delete messages. The token goes to the system keyring and is never written to files.

You do this once; it takes about ten minutes."""
step_header = "Step {n} of {total}. {title}"
ask_path = "Path to the downloaded client JSON:"
opening_browser = "Opening the browser to sign in to Google…"
copy_url = "Open the link below in a browser on this computer:"
prompt_url = "Open in a browser: {url}"
browser_success = "Subwatch has access now. You can close this window."
extra_scopes = "Google granted extra permissions ({scopes}) — Subwatch does not use them."
connected = "Gmail connected: {email}"
saved = "The source is enabled in {path}"
delete_json = "Delete {path}? The client secret is already in the keyring."
json_deleted = "File deleted."
reminder_production = "If the project stayed in Testing mode, Google revokes access after 7 days. Switch it to “In production” (step 5) and run subwatch auth gmail again."

[auth.gmail.step1]
title = "Project"
body = "Open https://console.cloud.google.com/projectcreate and create a project, e.g. “subwatch”. No billing is needed."

[auth.gmail.step2]
title = "Gmail API"
body = "Enable the Gmail API for the project: https://console.cloud.google.com/apis/library/gmail.googleapis.com → “Enable”."

[auth.gmail.step3]
title = "Consent screen"
body = """Open Google Auth Platform → Branding: https://console.cloud.google.com/auth/branding
  • App name — anything, e.g. “Subwatch”;
  • User support email and Developer contact — your address.
In Audience choose “External” and add your Gmail address to Test users."""

[auth.gmail.step4]
title = "Permission"
body = "In Data Access click “Add or remove scopes” and add only https://www.googleapis.com/auth/gmail.readonly. Nothing else is needed."

[auth.gmail.step5]
title = "“In production” mode — important"
body = """While the project is in Testing mode, Google issues a token for 7 days only and you would have to sign in again. For personal use switch the project to production: Audience → “Publish app” → confirm.

No Google verification is needed for that: the project is yours and so is the only user. When signing in Google shows “Google hasn't verified this app” — this is normal for your own project. Click “Advanced” → “Go to Subwatch (unsafe)”."""

[auth.gmail.step6]
title = "OAuth client"
body = "Clients → “Create client” → type “Desktop app” → any name → Create. Download the JSON (“Download JSON”)."

[auth.gmail.step7]
title = "Sign in"
body = "Give the path to the downloaded JSON below. A browser opens: sign in to the Gmail account and allow read-only access."

