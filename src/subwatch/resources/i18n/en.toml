[cli.app]
help = """Subwatch — a local subscription tracker for Omarchy.

Finds subscriptions in your mail (Gmail, IMAP) and bank statements, reminds you about upcoming charges and adds up what they cost per month. Everything stays on your computer.

Without a command it opens the TUI."""
epilog = "Docs: README.md and docs/. Check the installation: subwatch doctor"

