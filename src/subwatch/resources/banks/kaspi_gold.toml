# Выписка Kaspi Gold в PDF (приложение Kaspi.kz → Kaspi Gold → Выписка).
# Строка операции выглядит так:
#   01.10.26   - 2 990,00 ₸   Покупка   YANDEX.PLUS
title = "Kaspi Gold (PDF)"
format = "pdf"
currency = "KZT"
date_format = "%d.%m.%y"
include_types = ["Покупка", "Покупки"]

[pdf]
detect_text = ["Kaspi Gold"]
line_regex = '^(?P<date>\d{2}\.\d{2}\.\d{2,4})\s+(?P<sign>[-+])\s?(?P<amount>\d{1,3}(?:[\s ]\d{3})*,\d{2})\s*₸\s+(?P<type>\S+)\s+(?P<description>.+)$'
