# Конфигурация Subwatch.
#
# Файл можно править руками или командами:
#   subwatch config get reminders.days_before
#   subwatch config set reminders.days_before "[7, 3, 1]"
#   subwatch config edit        открыть в редакторе и проверить после сохранения
#   subwatch config check       проверить без запуска
#   subwatch config diff        чем текущие настройки отличаются от стандартных
#   subwatch config reset       вернуть этот файл (старый сохранится рядом)
#
# Приоритет значений (сверху вниз):
#   1. флаг командной строки (--set ключ=значение и флаги команд)
#   2. переменная окружения SUBWATCH_<РАЗДЕЛ>__<КЛЮЧ>, например
#      SUBWATCH_CURRENCY__BASE=USD или SUBWATCH_SCAN__MONTHS_BACK=6
#   3. этот файл
#   4. значение по умолчанию
#
# Изменения подхватываются на лету: TUI перечитывает файл, а таймеры и
# фоновые задачи читают его при каждом запуске. Если поменялось расписание
# сканирования или горячие клавиши, `subwatch config set` применит это сам;
# после ручной правки запустите `subwatch integrate apply`.
#
# Длительности пишутся как "15m", "4h", "1d", "2w" (s, m, h, d, w).
# Время суток — "ЧЧ:ММ". Периоды подписок — "1m", "3m", "1y", "1w", "14d".

# ---------------------------------------------------------------------------
[ui]
# Язык интерфейса: ru или en. Новый язык можно добавить файлом
# ~/.config/subwatch/i18n/<код>.toml без правки кода.
language = "ru"
# Тема TUI: "auto" — цвета текущей темы Omarchy (а если её нет —
# textual-dark), "omarchy" — только тема Omarchy, либо имя встроенной темы
# Textual: textual-dark, textual-light, nord, gruvbox, tokyo-night и т. д.
theme = "auto"
# Сортировка списка при запуске: next_charge (ближайшее списание), amount
# (сумма), monthly (в пересчёте на месяц), name, category, status.
default_sort = "next_charge"
# Обратный порядок сортировки.
sort_reverse = false
# Показывать отменённые подписки в общем списке.
show_cancelled = false
# Как показывать даты: both — «22 октября, через 3 дня», relative — только
# «через 3 дня», absolute — только «22 октября».
date_style = "both"
# Сколько знаков после запятой показывать у сумм (0–2).
money_decimals = 2
# Чем открывать TUI из меню, панели и горячих клавиш: "auto" (средствами
# Omarchy, иначе xdg-terminal-exec) или своя команда, например
# "ghostty -e" — к ней допишется «subwatch tui».
terminal = "auto"
# Как часто TUI проверяет, не изменился ли этот файл и тема (секунды).
reload_interval = 2

# Свои цвета поверх темы, формат "#rrggbb". Пустая строка — взять из темы.
[ui.colors]
# Основной цвет (выделение, заголовки).
primary = ""
# Второстепенный цвет.
secondary = ""
# Акцент.
accent = ""
# Фон.
background = ""
# Текст.
foreground = ""
# Фон панелей и таблиц.
surface = ""
# Фон боковых блоков.
panel = ""
# «Всё хорошо» (в рамках бюджета).
success = ""
# Предупреждение (скоро списание, бюджет почти исчерпан).
warning = ""
# Ошибка, превышение бюджета.
error = ""

# Клавиши TUI. Можно указать несколько через запятую. Имена клавиш — как в
# Textual: "j", "G" (это Shift+g), "ctrl+d", "enter", "escape", "slash",
# "question_mark", "comma".
[ui.keys]
# Вниз по списку.
down = "j,down"
# Вверх по списку.
up = "k,up"
# В начало списка.
top = "g,home"
# В конец списка.
bottom = "G,end"
# На страницу вниз.
page_down = "ctrl+d,pagedown"
# На страницу вверх.
page_up = "ctrl+u,pageup"
# Открыть карточку подписки.
open = "enter,l"
# Назад / закрыть окно.
back = "escape,h"
# Поиск по названию.
search = "slash"
# Фильтр по категории и статусу.
filter = "f"
# Сменить поле сортировки.
sort = "s"
# Развернуть порядок сортировки.
reverse = "S"
# Добавить подписку.
add = "a"
# Изменить подписку.
edit = "e"
# Удалить подписку.
delete = "d"
# Отметить отменённой (и открыть страницу отмены, если она известна).
cancel = "x"
# Отметить, что подпиской сегодня пользовались (для поиска «зомби»).
used = "u"
# Вкладка «Проверка».
review = "r"
# Подтвердить находку в очереди проверки.
confirm = "y"
# Отклонить находку («это не подписка» навсегда).
reject = "n"
# Вкладка с графиками.
charts = "c"
# Вкладка со списком подписок.
subscriptions = "1"
# Запустить сканирование.
rescan = "R"
# Открыть этот файл в редакторе.
config = "comma"
# Справка по клавишам.
help = "question_mark"
# Выход.
quit = "q"

# ---------------------------------------------------------------------------
[general]
# Часовой пояс для напоминаний и дат: "local" — системный, либо имя из базы
# tz, например "Asia/Almaty".
timezone = "local"

# ---------------------------------------------------------------------------
[currency]
# Базовая валюта: в ней считаются итоги, бюджеты и пороги сумм.
base = "KZT"
# Откуда брать курсы: auto (для KZT — Нацбанк РК, для RUB — ЦБ РФ, иначе
# open.er-api.com), nbk, cbr, open_er_api, frankfurter (курсы ЕЦБ) или
# manual (только курсы ниже). Без сети используются сохранённые курсы, а если
# их нет — manual_rates.
rates_source = "auto"
# Сколько часов считать сохранённые курсы свежими.
cache_ttl_hours = 12
# Таймаут запроса курсов, секунды.
timeout = 10

# Ручные курсы: сколько базовой валюты стоит одна единица.
# Пример для базы KZT:
#   USD = 520.0
#   RUB = 6.4
[currency.manual_rates]

# ---------------------------------------------------------------------------
[scan]
# Расписание сканирования (systemd OnCalendar): "daily", "hourly",
# "*-*-* 09:00", "Mon..Fri 08:30" и т. п. Также можно интервалом: "6h".
schedule = "daily"
# Случайная задержка запуска, чтобы не дёргать почту ровно в одно время.
randomized_delay = "10m"
# Если компьютер был выключен в момент запуска — выполнить при включении.
persistent = true
# Глубина поиска в почте при первом сканировании, месяцев. Дальше
# сканирование инкрементальное: читаются только новые письма.
months_back = 12
# Максимум писем за один запуск на один источник.
max_messages = 5000
# Приоритет процесса (nice), 0–19: чем больше, тем незаметнее для системы.
nice = 10
# Приоритет ввода-вывода: idle (только когда диск свободен), best-effort
# или none (не менять).
io_class = "idle"
# Уведомить по итогам сканирования, если нашлось что-то новое.
notify_summary = true
# Сразу после сканирования проверить, не пора ли напомнить о списаниях.
remind_after_scan = true

# ---------------------------------------------------------------------------
# Gmail. Подключение: subwatch auth gmail (нужен свой проект в Google Cloud,
# мастер всё объяснит). Доступ только на чтение (gmail.readonly), токен
# хранится в keyring.
[sources.gmail]
# Включить источник.
enabled = false
# Имя учётной записи — просто метка, под ней токен лежит в keyring.
account = "default"
# Искать только в этих ярлыках (например ["INBOX", "Receipts"]). Пусто —
# во всей почте, кроме exclude_labels.
labels = []
# Ярлыки, которые пропускать.
exclude_labels = ["SPAM", "TRASH"]
# Дополнительное условие поиска Gmail, например "-category:promotions".
query = ""
# Ограничение частоты запросов к API, запросов в секунду.
rate_limit = 8.0
# Сколько раз повторять запрос при сетевой ошибке или 429/5xx.
max_retries = 5

# ---------------------------------------------------------------------------
# IMAP — любой почтовый сервис с паролем приложения (Яндекс, Mail.ru,
# Outlook, Fastmail...). Учётку проще добавить командой
#   subwatch auth imap --name yandex --host imap.yandex.ru --user me@yandex.ru
# Пароль спросится и уйдёт в keyring, сюда попадут только адрес и папки.
# Почтовые ящики открываются только на чтение (EXAMINE), письма не
# помечаются прочитанными.
[sources.imap]
# Включить источник.
enabled = true
# Сколько раз переподключаться при обрыве.
max_retries = 3
# Сколько байт письма скачивать максимум (вложения не нужны).
fetch_max_bytes = 200000
# По сколько заголовков запрашивать за раз.
batch_size = 200
# Учётные записи. Пример:
#   [[sources.imap.accounts]]
#   name = "yandex"            # метка, латиницей
#   host = "imap.yandex.ru"
#   username = "me@yandex.ru"
#   port = 993
#   ssl = true                 # TLS сразу при подключении
#   starttls = false           # или STARTTLS на обычном порту
#   folders = ["INBOX"]        # какие папки смотреть
#   enabled = true
#   timeout = 30               # таймаут сети, секунды
accounts = []

# ---------------------------------------------------------------------------
# Банковские выписки (CSV и PDF). Шаблоны банков лежат в
# ~/.config/subwatch/banks/*.toml, примеры — в contrib/banks.
[sources.statements]
# Папка, из которой выписки импортируются автоматически при каждом
# сканировании. Пусто — только вручную: subwatch import файл.csv
inbox_dir = ""
# Шаблон по умолчанию: "auto" — угадать по заголовкам файла.
default_bank = "auto"
# Сколько дней хранить операции из выписок (нужны для поиска повторов).
# Хранятся только дата, сумма и нормализованное имя получателя.
keep_transactions_days = 800

# ---------------------------------------------------------------------------
# Фильтры: что никогда не считать подпиской. Решения «это не подписка» из
# очереди проверки запоминаются отдельно, их видно в `subwatch rules list`.
[filters]
# Отправители, которых пропускать. Можно маски: "*@news.example.com".
exclude_senders = []
# Сервисы, которые не считать подписками, например ["Ozon"].
exclude_services = []
# Слова в теме письма, при которых письмо пропускается.
exclude_keywords = []

# ---------------------------------------------------------------------------
[extraction]
# На каких языках распознавать письма: ru, en, kk.
languages = ["ru", "en", "kk"]
# Уверенность, начиная с которой находка сразу становится подпиской.
auto_accept = 0.8
# Уверенность, начиная с которой находка попадает в очередь проверки.
# Всё, что ниже, отбрасывается.
review_threshold = 0.45
# Сохранять ли короткий фрагмент письма рядом с подпиской. По умолчанию
# хранятся только извлечённые поля, текст писем не сохраняется.
store_snippets = false
# Длина фрагмента, если store_snippets = true.
snippet_chars = 300
# Свои ключевые слова, которые говорят «это письмо про подписку».
extra_keywords = []

# ---------------------------------------------------------------------------
# Поиск повторяющихся списаний в выписках.
[recurrence]
# Какие периоды искать, в днях.
periods = [7, 30, 90, 365]
# Допуск по дате в процентах от периода (30 дней × 10 % = ±3 дня).
tolerance_pct = 10.0
# Но не больше стольких дней.
max_tolerance_days = 10
# Допуск по сумме, в процентах.
amount_tolerance_pct = 5.0
# Сколько раз списание должно повториться, чтобы считаться подпиской.
min_occurrences = 3
# То же для годовых списаний.
min_occurrences_yearly = 2

# ---------------------------------------------------------------------------
# AI-слой. Выключен по умолчанию и нужен только для писем, которые не
# разобрали правила. Перед отправкой из текста вырезаются адреса, номера карт
# и телефонов; что именно уйдёт, показывает
#   subwatch scan --ai-dry-run   или   subwatch ai test письмо.eml --dry-run
# Ключ облачного провайдера: subwatch auth ai
[ai]
# Включить AI-слой.
enabled = false
# Провайдер: ollama (локально), openai, openrouter, groq, anthropic и
# любой другой, который знает LiteLLM (нужен ./install.sh --with-ai).
# OpenAI-совместимые API и Ollama работают и без LiteLLM.
provider = "ollama"
# Модель.
model = "llama3.1:8b"
# Адрес API. Пусто — стандартный для провайдера (для Ollama
# http://localhost:11434).
api_base = ""
# Лимит запросов за одно сканирование.
max_requests_per_scan = 20
# Лимит запросов в сутки.
max_requests_per_day = 100
# Сколько символов текста письма отправлять максимум.
max_input_chars = 1500
# Таймаут запроса, секунды.
timeout = 60
# Температура модели.
temperature = 0.0
# Чистить текст и для локальной модели (для облачной чистится всегда).
redact_local = true
# Хранить в журнале сам отправленный (уже очищенный) текст, а не только
# время, модель и размер.
audit_payloads = false

# ---------------------------------------------------------------------------
[reminders]
# Включить напоминания.
enabled = true
# За сколько дней до списания напоминать (0 — в день списания).
days_before = [3, 1]
# Во сколько.
time = "10:00"
# Повторять напоминание, если на него не отреагировали.
repeat_unacknowledged = true
# Через сколько повторять.
repeat_every = "4h"
# Сколько раз повторять максимум.
max_repeats = 2
# На сколько откладывать по умолчанию.
snooze = "1d"
# Варианты «Отложить» в меню уведомления.
snooze_options = ["3h", "1d", "3d"]
# За сколько дней напоминать о конце пробного периода.
trial_days_before = [2, 0]
# По какой сумме применять пороги min_amount/max_amount в правилах:
# charge — сумма одного списания, monthly — в пересчёте на месяц.
amount_basis = "charge"
# Как часто таймер проверяет, не пора ли напомнить.
check_interval = "15m"

# Правила напоминаний. Применяется самое конкретное подходящее правило:
# по сервису > по сумме > по категории. Не указанные в правиле параметры
# берутся из [reminders]. Суммы — в базовой валюте. Примеры:
#
#   [[reminders.rules]]
#   name = "дорогие — за неделю"
#   min_amount = 10000
#   days_before = [7, 3, 1]
#
#   [[reminders.rules]]
#   name = "видео вечером"
#   categories = ["video"]
#   time = "19:00"
#
#   [[reminders.rules]]
#   name = "не беспокоить про iCloud"
#   services = ["iCloud+"]
#   enabled = false
#
# Поля правила: name, services, categories, min_amount, max_amount,
# days_before, time, repeat, enabled.
rules = []

# Тихие часы: напоминание, попавшее в этот интервал, придёт в его конце.
[reminders.quiet_hours]
# Включить тихие часы.
enabled = true
# Начало.
start = "22:00"
# Конец.
end = "08:00"

# ---------------------------------------------------------------------------
[notifications]
# Куда отправлять: auto (определить демон), omarchy (уведомления Omarchy,
# действия — по клику), notify-send (mako, dunst и др., кнопки в
# уведомлении), none (не показывать).
backend = "auto"
# Важность: low, normal, critical.
urgency = "normal"
# Сколько показывать, мс. 0 — на усмотрение демона.
timeout_ms = 0
# Значок (глиф Nerd Font) для уведомлений Omarchy.
glyph = "\uf09d"
# Уведомлять об итогах сканирования.
on_scan_summary = true
# Уведомлять об ошибках фоновых задач.
on_job_failed = true
# Уведомлять о превышении бюджета.
on_budget = true
# Уведомлять о подорожании.
on_price_change = true
# Уведомлять о возможных дублях.
on_duplicates = true
# Уведомлять о «зомби»-подписках.
on_zombies = true

# ---------------------------------------------------------------------------
[budget]
# Общий лимит трат на подписки в месяц, в базовой валюте. 0 — без лимита.
monthly_limit = 0
# С какого процента лимита предупреждать.
warn_at_pct = 90
# Учитывать ли в бюджете находки из очереди проверки.
include_review = false

# ---------------------------------------------------------------------------
# Категории. Ключ раздела — латиницей, поля у каждой категории одинаковые:
#   name   — как показывать категорию;
#   icon   — значок (глиф Nerd Font) для TUI и меню;
#   budget — месячный лимит по категории в базовой валюте, 0 — без лимита.
# Свои категории добавляются так же:
#   [categories.health]
#   name = "Здоровье"
#   icon = "󰋑"
[categories.music]
name = "Музыка"
icon = "󰝚"
budget = 0

[categories.video]
name = "Видео"
icon = "󰎁"
budget = 0

[categories.cloud]
name = "Облако"
icon = "\uf0c2"
budget = 0

[categories.games]
name = "Игры"
icon = "󰊗"
budget = 0

[categories.education]
name = "Обучение"
icon = "󰑴"
budget = 0

[categories.software]
name = "Софт"
icon = "󰘔"
budget = 0

[categories.other]
name = "Прочее"
icon = "󰇘"
budget = 0

# Правила автокатегорий (category_rules): срабатывают раньше встроенного
# справочника сервисов.
#   [[category_rules]]
#   category = "education"
#   services = ["Skillbox"]
#   senders = ["*@skillbox.ru"]
#   keywords = ["курс"]

# Правила тегов (tag_rules). Поля: tag, services, categories, senders, keywords,
# min_amount.
#   [[tag_rules]]
#   tag = "работа"
#   services = ["JetBrains", "GitHub Copilot"]

# ---------------------------------------------------------------------------
# Хуки: команды оболочки на события. Данные события приходят в переменных
# окружения (SUBWATCH_EVENT, SUBWATCH_SERVICE, SUBWATCH_AMOUNT,
# SUBWATCH_CURRENCY, SUBWATCH_DATE, SUBWATCH_SUBSCRIPTION_ID) и полностью —
# JSON-ом на stdin. Пример:
#   new_subscription = ["notify-send 'Новая подписка' \"$SUBWATCH_SERVICE\""]
[hooks]
# Найдена новая подписка.
new_subscription = []
# Скоро списание (вместе с напоминанием).
upcoming_charge = []
# Изменилась цена.
price_changed = []
# Фоновая задача завершилась ошибкой.
job_failed = []
# Превышен бюджет (общий или по категории).
budget_exceeded = []
# Найден возможный дубль.
duplicate_found = []
# Найдена «зомби»-подписка.
zombie_found = []
# Подписка отменена.
subscription_cancelled = []
# Таймаут одной команды, секунды.
timeout = 30
# Чем выполнять команды.
shell = "bash"

# ---------------------------------------------------------------------------
[detection]
# Минимальное изменение цены в процентах, о котором сообщать.
price_change_pct = 1.0
# Искать дубли (две подписки на одно и то же).
duplicates = true
# Насколько похожими должны быть названия, чтобы считать их дублем (0.5–1).
duplicate_similarity = 0.85
# Искать «зомби»: подписки, которыми давно не пользовались. Работает для
# подписок, где вы хоть раз отметили использование (клавиша u в TUI или
# subwatch used <сервис>).
zombies = true
# Через сколько дней без использования подписка считается «зомби».
zombie_days = 45

# ---------------------------------------------------------------------------
[export]
# Обновлять календарь .ics после каждого изменения.
ics_auto = true
# Куда писать .ics. Пусто — ~/.local/share/subwatch/subwatch.ics. На этот
# файл можно подписаться в календаре как на локальный (file://...).
ics_path = ""
# На сколько месяцев вперёд строить календарь.
ics_months_ahead = 12
# За сколько дней напоминать в календаре (0 — без напоминания).
ics_alarm_days = 1
# Включать находки из очереди проверки.
ics_include_review = false

# ---------------------------------------------------------------------------
# Модуль панели (Omarchy или Waybar).
[bar]
# Что показывать: total — сумма в месяц, next — ближайшее списание, auto —
# ближайшее, если оно в пределах next_within_days, иначе сумму.
mode = "auto"
# Окно для режима auto, дней.
next_within_days = 7
# Значок.
icon = "\uf09d"
# Как часто панель обновляет модуль, секунды.
interval = 300
# Сколько ближайших списаний показывать во всплывающей подсказке.
tooltip_items = 6
# В какую часть панели Omarchy ставить модуль: left, center, right.
section = "right"
# Прятать модуль, если подписок нет.
hide_when_empty = false

# ---------------------------------------------------------------------------
# Горячие клавиши Hyprland. Применяются командой subwatch keybinds apply
# (или сами после subwatch config set). Пустая строка — без клавиши. Перед
# применением проверяется, не заняты ли сочетания.
[keybinds]
# Создавать ли бинды вообще.
enabled = true
# Открыть TUI.
open_tui = "SUPER + CTRL + U"
# Показать ближайшие списания уведомлением.
upcoming = "SUPER + CTRL + ALT + U"
# Меню Subwatch.
menu = "SUPER + CTRL + SHIFT + U"
# Запустить сканирование.
rescan = ""
# Добавить подписку.
add = ""
# Если сочетание уже занято — снять старый бинд и поставить свой. По
# умолчанию занятые сочетания пропускаются с предупреждением.
override_conflicts = false
# Применять бинды автоматически при `subwatch config set keybinds.*`.
auto_apply = true

# ---------------------------------------------------------------------------
[menu]
# Добавлять пункт Subwatch в меню Omarchy.
enabled = true
# Чем показывать списки: auto, omarchy, walker, fuzzel, wofi, rofi, fzf.
picker = "auto"
# На сколько дней вперёд показывать «Ближайшие списания».
upcoming_days = 30

# ---------------------------------------------------------------------------
[storage]
# Шифровать базу ключом из keyring (AES-256-GCM). Рабочая копия живёт в
# $XDG_RUNTIME_DIR (оперативная память) и исчезает при выходе из сессии.
encrypt = false
# Свой путь к базе. Пусто — ~/.local/share/subwatch/subwatch.db
db_path = ""
# Делать копию базы перед обновлением её схемы.
backup_before_migrate = true

# ---------------------------------------------------------------------------
[logging]
# Уровень журнала: debug, info, warning, error.
level = "info"
# Писать в journald (journalctl --user -t subwatch).
journal = true
# Дополнительно писать в файл. Пусто — не писать.
file = ""

# ---------------------------------------------------------------------------
# Плагины-источники: ~/.config/subwatch/plugins/*.py, пример в
# contrib/plugins/. Список загруженных: subwatch plugins list
[plugins]
# Загружать плагины.
enabled = true
# Плагины, которые не загружать (по имени источника).
disabled = []

# Настройки плагинов: [plugins.options.<имя>] ключ = значение
[plugins.options]
