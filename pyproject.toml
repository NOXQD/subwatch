[project]
name = "subwatch"
version = "0.1.0"
description = "Локальный трекер подписок для Omarchy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "NOXQD" }]
dependencies = [
    "pydantic>=2.9",
    "typer>=0.15",
    "textual>=1.0",
    "keyring>=25",
    "tomlkit>=0.13",
    "imapclient>=3.0",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "pdfplumber>=0.11",
    "cryptography>=43",
]

[project.optional-dependencies]
ai = ["litellm>=1.50"]

[project.scripts]
subwatch = "subwatch.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
