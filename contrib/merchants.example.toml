# Свой справочник сервисов. Скопируйте в ~/.config/subwatch/merchants.toml.
#
# Можно добавить новый сервис или поправить встроенный, указав тот же ключ
# (список встроенных — src/subwatch/resources/merchants.toml). Поля:
#   name       — как называть сервис
#   category   — ключ категории из config.toml
#   senders    — домены или адреса отправителей
#   patterns   — регулярные выражения для строк выписки и текста писем
#   period     — период по умолчанию: 1m, 3m, 1y...
#   cancel_url — страница отмены
#   includes   — какие сервисы входят в пакет (для поиска дублей)

# Новый сервис
[megadisk]
name = "Мегадиск"
category = "cloud"
senders = ["megadisk.example"]
patterns = ['megadisk', 'мегадиск']
period = "1m"
cancel_url = "https://megadisk.example/account/billing"

# Встроенный сервис в другой категории
[netflix]
category = "other"
