# Пример своего шаблона банка. Скопируйте файл в
# ~/.config/subwatch/banks/<имя>.toml и поправьте под свою выписку.
# Имя файла — это имя шаблона: subwatch import выписка.csv --bank <имя>
#
# Быстрее всего получить шаблон так:
#   subwatch import выписка.csv --map "date=Дата,amount=Сумма,description=Детали" \
#       --save-template mybank
# Команда сама запишет этот файл.

# Как показывать шаблон в списке (subwatch banks).
title = "Мой банк"

# csv или pdf.
format = "csv"

# Валюта счёта, если в файле её нет. Пусто — базовая из config.toml.
currency = "KZT"

# Кодировка файла: auto (UTF-8, затем cp1251), utf-8, cp1251...
encoding = "auto"

# Разделитель колонок: auto, ";", ",", "tab".
delimiter = "auto"

# Сколько строк пропустить перед строкой заголовков.
skip_rows = 0

# Формат даты в нотации Python strftime. Пусто — угадать.
date_format = "%d.%m.%Y"

# true — списания записаны отрицательными числами, пополнения
# положительными. false — списания положительные (или отдельная колонка).
debit_negative = true

# По каким заголовкам узнать этот формат автоматически (все должны быть).
detect_headers = ["Дата", "Сумма", "Детали"]

# Учитывать только операции этих типов (по колонке type)...
include_types = []
# ...или, наоборот, пропускать эти.
exclude_types = ["Пополнение", "Перевод"]

[columns]
# Обязательные: дата, сумма (или debit), описание получателя.
date = "Дата"
amount = "Сумма"
description = "Детали"
# Необязательные:
# currency = "Валюта"
# debit = "Расход"        # если списания в отдельной колонке
# credit = "Приход"
# type = "Тип операции"

# Для PDF вместо [columns] задаётся регулярное выражение для строки
# операции с именованными группами date, amount, description и, по желанию,
# sign (+/-), currency и type:
# [pdf]
# detect_text = ["Название банка"]
# line_regex = '^(?P<date>\d{2}\.\d{2}\.\d{4})\s+(?P<description>.+?)\s+(?P<sign>[-+])(?P<amount>[\d\s]+,\d{2})$'
